[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cfo-yantra-backend"
version = "1.0.0"
description = "CFO Yantra Financial Intelligence & Tally Integration Engine (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.38",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-socketio>=5.11.0",
    "python-engineio>=4.9.0",
    "defusedxml>=0.7.1",
    "structlog>=24.1.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4"
]

